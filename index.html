<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distance:2056</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#fff;
  color:#111;
  font-family:"Helvetica Neue","Hiragino Kaku Gothic ProN",Arial,sans-serif;
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.96);
}
main{
  width:min(760px, calc(100% - 48px));
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
h1{
  margin:0 0 110px;
  font-size:32px;
  line-height:1;
  font-weight:400;
  letter-spacing:.04em;
}
.choices{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:80px;
}
button{
  appearance:none;
  width:170px;
  height:170px;
  border:0;
  border-radius:50%;
  background:rgba(235,235,235,.78);
  color:#111;
  padding:0;
  font-size:16px;
  font-weight:400;
  letter-spacing:.05em;
  cursor:pointer;
  transition:background .2s ease, transform .2s ease;
}
button:hover{
  background:rgba(225,225,225,.9);
  transform:scale(1.02);
}
@media(max-width:600px){
  main{width:calc(100% - 32px)}
  h1{font-size:28px;margin-bottom:90px}
  .choices{gap:22px}
  button{width:140px;height:140px;font-size:15px}
}
</style>
</head>
<body>
<main>
  <h1>Distance:2056</h1>
  <div class="choices">
    <button type="button">耳で聴く</button>
    <button type="button">文字で聴く</button>
  </div>
</main>
</body>
</html>
